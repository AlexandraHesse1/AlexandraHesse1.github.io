<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIX Vote</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:min(92vw,420px);
  text-align:center;
}

/* LOADER */
.loader{
  width:60px;
  height:60px;
  margin:0 auto 30px;
}

.loader svg{
  width:100%;
  height:100%;
  animation:spin 1.2s linear infinite;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

/* HEADER */
.date{
  font-size:.9rem;
  opacity:.8;
  margin-bottom:5px;
}

.title{
  font-size:1.6rem;
  margin-bottom:30px;
}

/* CARD */
.card{
  background:#eee;
  color:#111;
  padding:40px 20px 60px;
  margin:20px 0 40px;
}

/* QUESTION */
.question{
  font-size:1.4rem;
  font-weight:700;
  line-height:1.5;
  margin-bottom:35px;
}

.subtext{
  margin-bottom:60px;
}

/* BUTTONS */
.buttons{
  display:flex;
  gap:20px;
  justify-content:center;
  margin-top:20px;
}

button{
  padding:14px 30px;
  font-size:1.1rem;
  border:none;
  border-radius:6px;
  background:#000;
  color:#fff;
  cursor:pointer;
  min-width:120px;
}

button:disabled{
  opacity:.5;
}

/* HIDDEN RESET BUTTON */
.reset-btn{
  margin-top:20px;
  background:#000;
  color:#000;
  border:none;
  padding:10px 20px;
  cursor:pointer;
}

/* FOOTER */
.footer{
  margin-top:40px;
  font-size:.9rem;
  opacity:.8;
}

.time{
  font-size:1.4rem;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOADER -->
  <div class="loader" id="loader">
    <svg viewBox="0 0 50 50">
      <circle
        cx="25"
        cy="25"
        r="20"
        fill="none"
        stroke="#fff"
        stroke-width="6"
        stroke-linecap="round"
        stroke-dasharray="90 150"
      />
    </svg>
  </div>

  <!-- HEADER -->
  <div class="date">20.05.2026</div>
  <div class="title">This weeks question</div>

  <!-- CARD -->
  <div class="card">

    <div class="question">
      Should art be free?
    </div>

    <div class="subtext">
      Your opinion is asked
    </div>

    <div class="buttons">
      <button id="yesBtn">YES</button>
      <button id="noBtn">NO</button>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    Voting open until
    <div class="time">10pm</div>

    <!-- INVISIBLE RESET BUTTON -->
    <button id="resetBtn" class="reset-btn">
      RESET
    </button>
  </div>

</div>

<script>
const SUPABASE_URL =
"https://exmrqibjgsdmuwjoeodz.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4bXJxaWJqZ3NkbXV3am9lb2R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODQ3NTMsImV4cCI6MjA5MjM2MDc1M30.jYknpEAU7bx71svQmFvipVm5DGWE8SwvLtfzv66Fa2U";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const resetBtn = document.getElementById("resetBtn");
const loader = document.getElementById("loader");

function hideLoader(){
  loader.style.display = "none";
}

async function loadVotes(){

  const {error} = await db
    .from("votes")
    .select("*")
    .eq("id",1)
    .single();

  hideLoader();

  if(error){
    console.error(error);
  }
}

async function vote(choice){

  yesBtn.disabled = true;
  noBtn.disabled = true;

  const {error} =
    await db.rpc("increment_vote",{choice});

  yesBtn.disabled = false;
  noBtn.disabled = false;

  if(error){
    console.error(error);
  }
}

async function resetVotes(){

  const {error} = await db
    .from("votes")
    .update({
      yes_count:0,
      no_count:0
    })
    .eq("id",1);

  if(error){
    console.error(error);
  }
}

yesBtn.onclick = () => vote("yes");
noBtn.onclick = () => vote("no");
resetBtn.onclick = resetVotes;

loadVotes();
</script>

</body>
</html>
